<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#133829"/>
      <stop offset="65%" stop-color="#0A1C14"/>
      <stop offset="100%" stop-color="#040B08"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A640F"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="toriiRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B4B"/>
      <stop offset="100%" stop-color="#9E0B18"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>

  <!-- Mystic Chakra Halo -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-dasharray="14 8" opacity="0.75"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#cyanGlow)" stroke-width="3" opacity="0.6"/>

  <!-- Torii Gate Silhouette (original design) -->
  <path d="M120 170 Q256 145 392 170 L402 188 Q256 165 110 188 Z" fill="url(#toriiRed)"/>
  <rect x="135" y="210" width="242" height="14" rx="4" fill="url(#toriiRed)"/>
  <rect x="160" y="180" width="22" height="190" fill="url(#toriiRed)"/>
  <rect x="330" y="180" width="22" height="190" fill="url(#toriiRed)"/>

  <!-- Vedic Pillar Base Carving -->
  <polygon points="140,390 372,390 400,430 112,430" fill="url(#goldGrad)" opacity="0.85"/>

  <!-- Hybrid Weapon: Trident-Katana (Chakrastra, original design) -->
  <polygon points="256,65 270,150 264,360 248,360 242,150" fill="url(#cyanGlow)" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M256 200 Q190 190 195 120 Q200 95 215 80 Q210 140 248 175 Z" fill="url(#goldGrad)"/>
  <path d="M256 200 Q322 190 317 120 Q312 95 297 80 Q302 140 264 175 Z" fill="url(#goldGrad)"/>

  <!-- Hilt & Guard -->
  <ellipse cx="256" cy="360" rx="45" ry="12" fill="url(#goldGrad)" stroke="#3A2500" stroke-width="3"/>
  <rect x="247" y="365" width="18" height="85" rx="6" fill="#2A1208" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="256" cy="456" r="14" fill="url(#cyanGlow)" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Jungle Vines Foreground -->
  <path d="M40 380 Q110 340 90 440 Q60 400 40 380 Z" fill="#1F7A4C"/>
  <path d="M472 380 Q402 340 422 440 Q452 400 472 380 Z" fill="#1F7A4C"/>
</svg>
