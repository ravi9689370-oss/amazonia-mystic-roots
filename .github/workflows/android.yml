name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      # Builds dist/ with Vite (base './') and generates capacitor.config.json
      # (appName read from src/config.js) + assets/icon.svg & assets/splash.svg
      - name: Build Web Bundle
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android
          npx capacitor-assets generate --android || true
          npx cap sync android

      - name: Compile Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sanity Check APK Exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: amazonia-mystic-roots-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
